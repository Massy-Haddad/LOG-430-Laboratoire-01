global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'store-service'
    metrics_path: /api/v1/store/metrics
    static_configs:
      - targets:
          - 'store:3000'
        labels:
          service: 'store'
    scrape_interval: 15s

  - job_name: 'ecommerce-service'
    metrics_path: /api/v1/ecommerce/metrics
    static_configs:
      - targets:
          - 'ecommerce:3000'
        labels:
          service: 'ecommerce'
    scrape_interval: 15s
