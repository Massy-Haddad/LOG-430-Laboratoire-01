networks:
  pos-net: null
services:
  auth:
    container_name: auth
    build:
      context: ./auth
    command: sh -c 'npm run seed && npm run dev'
    depends_on:
      - db
    networks:
      - pos-net
    ports:
      - "3001:3000"
    volumes:
      - ./auth:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    environment:
      - DB_NAME=pos_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production-min-256-bits-long}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-log430-api}
      - JWT_ISSUER=${JWT_ISSUER:-log430-auth-service}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-3600}
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  store:
    container_name: store
    build:
      context: ./store
    command: sh -c 'node src/infrastructure/seed.js && npm run dev'
    depends_on:
      - db
      - redis
    networks:
      - pos-net
    ports:
      - "3000"
    volumes:
      - ./store:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/store/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
  ecommerce:
    container_name: ecommerce
    build:
      context: ./e-commerce
    command: sh -c 'npm run seed && npm run dev'
    depends_on:
      - db
      - redis
    networks:
      - pos-net
    ports:
      - "3003:3000"
    volumes:
      - ./e-commerce:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    environment:
      - DB_NAME=pos_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres  
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/ecommerce/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    container_name: pos_pg
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:15
    networks:
    - pos-net
    ports:
    - 5432:5432
    restart: always
    volumes:
    - pos_data:/var/lib/postgresql/data
  grafana:
    container_name: grafana
    depends_on:
    - prometheus
    image: grafana/grafana
    networks:
    - pos-net
    ports:
    - 3002:3000
    volumes:
    - grafana-storage:/var/lib/grafana
  krakend:
    image: krakend
    container_name: krakend
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json
      - ./krakend/jwk_private_key.json:/etc/krakend/jwk_private_key.json
    ports:
      - "3000:3000"
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    networks:
      - pos-net
    environment:
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production-min-256-bits-long}
    depends_on:
      store:
        condition: service_healthy
      auth:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /openapi.json
    volumes:
      - ./krakend/openapi.json:/openapi.json:ro
    networks:
      - pos-net
    depends_on:
      - krakend
      - store
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    networks:
    - pos-net
    ports:
    - 9090:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  redis:
    container_name: redis
    image: redis:7
    networks:
    - pos-net
    ports:
    - 6379:6379
volumes:
  grafana-storage: null
  pos_data: null
