networks:
  pos-net: null
services:
  store:
    container_name: store
    build:
      context: ./store
    command: sh -c 'node src/infrastructure/seed.js && npm run dev'
    depends_on:
      - db
      - redis
    networks:
      - pos-net
    ports:
      - "3000"
    volumes:
      - ./store:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/store/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    container_name: pos_pg
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:15
    networks:
    - pos-net
    ports:
    - 5432:5432
    restart: always
    volumes:
    - pos_data:/var/lib/postgresql/data
  grafana:
    container_name: grafana
    depends_on:
    - prometheus
    image: grafana/grafana
    networks:
    - pos-net
    ports:
    - 3001:3000
    volumes:
    - grafana-storage:/var/lib/grafana
  krakend:
    image: krakend
    container_name: krakend
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json
    ports:
      - "3000:3000"
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    networks:
      - pos-net
    depends_on:
      store:
        condition: service_healthy
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    networks:
    - pos-net
    ports:
    - 9090:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  redis:
    container_name: redis
    image: redis:7
    networks:
    - pos-net
    ports:
    - 6379:6379
volumes:
  grafana-storage: null
  pos_data: null
